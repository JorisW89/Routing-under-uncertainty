<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif}svg{display:block}#hint{font-size:12px;color:#1d4ed8;font-weight:600;margin:2px 4px 5px}.edge.clickable{cursor:pointer}.edge.clickable:hover .hit{stroke:#2563eb;stroke-opacity:.5}.edge.clickable:hover .labelbg{fill:#dbeafe}.edge.clickable:focus{outline:none}</style></head><body><div id="hint"></div><div id="root"></div><script>
const root=document.getElementById('root'),hint=document.getElementById('hint');const key=(a,b)=>[a,b].sort().join('|');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const post=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const pump=(x,y)=>`<g transform="translate(${x-13},${y-42})"><rect width="18" height="24" rx="3" fill="#15803d"/><rect x="4" y="4" width="10" height="8" fill="#dcfce7"/><path d="M18 7C26 7 26 18 22 18L20 18" fill="none" stroke="#15803d" stroke-width="3"/></g>`;const shelter=(x,y)=>`<g transform="translate(${x-17},${y-48})"><path d="M0 13L17 0 34 13" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><rect x="5" y="13" width="24" height="17" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/><path d="M17 7V17M12 12H22" stroke="#fff" stroke-width="2"/></g>`;const truck=(x,y)=>`<g transform="translate(${x},${y})"><rect x="-15" y="-9" width="20" height="15" rx="2" fill="#f97316" stroke="#7c2d12" stroke-width="1.5"/><path d="M5-6L13-6 18 0V6H5Z" fill="#fb923c" stroke="#7c2d12" stroke-width="1.5"/><circle cx="-8" cy="8" r="4" fill="#1e293b"/><circle cx="12" cy="8" r="4" fill="#1e293b"/></g>`;
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function render(a){const n=a.nodes,e=a.edges,rev=new Set(a.revealed||[]),remote=new Set(a.remotely_checked||[]),stations=new Set(a.fuel_stations||[]),taken=[];hint.textContent=a.scout_enabled?`Click a gray road with a blue D marker to inspect it before the truck travels there (${a.credits_left} check${a.credits_left===1?'':'s'} left).`:'Drone checks are not available.';
const roads=e.map(([u,v,w,p])=>{const k=key(u,v),[x1,y1]=n[u],[x2,y2]=n[v],known=rev.has(k),open=a.states[k],click=a.scout_enabled&&!known,c=known?(open?'#16a34a':'#dc2626'):'#94a3b8',dash=known&&!open?'7,5':'',lab=remote.has(k)?`${w} | checked`:(known?`${w}`:`${w} | ${Math.round((1-p)*100)}%`),mx=(x1+x2)*4,my=(y1+y2)*2,spots=[[0,-16],[0,15],[-42,-8],[42,-8],[-42,18],[42,18],[0,-31],[0,30]];let box;for(const[oX,oY]of spots){const test={x:mx+oX-35,y:my+oY-10,w:70,h:20};if(!taken.some(q=>overlaps(test,q))){box=test;break}}if(!box)box={x:mx-35,y:my-10,w:70,h:20};taken.push(box);const lx=box.x+35,ly=box.y+13;return `<g class="edge ${click?'clickable':''}" data-e="${k}" ${click?'tabindex="0" role="button" aria-label="Check road '+u+' to '+v+'"':''}><line class="hit" x1="${x1*8}" y1="${y1*4}" x2="${x2*8}" y2="${y2*4}" stroke="${c}" stroke-width="${click?10:4}" stroke-opacity="${click?.14:1}" stroke-dasharray="${dash}"/><line x1="${x1*8}" y1="${y1*4}" x2="${x2*8}" y2="${y2*4}" stroke="${c}" stroke-width="${known?4:3}" stroke-dasharray="${dash}"/><rect class="labelbg" x="${box.x}" y="${box.y}" width="70" height="20" rx="7" fill="#fff" fill-opacity=".95"/><text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" fill="#0f172a">${esc(lab)}</text>${click?`<circle cx="${box.x+78}" cy="${box.y+8}" r="8" fill="#2563eb"/><text x="${box.x+78}" y="${box.y+12}" text-anchor="middle" font-size="11" fill="#fff">D</text>`:''}</g>`}).join('');
const nodes=Object.entries(n).map(([name,[x,y]])=>{const fuel=stations.has(name),fill=name===a.current?'#f59e0b':((name===a.start||name===a.goal)?'#2563eb':fuel?'#dcfce7':'#fff');return `${fuel?pump(x*8,y*4):''}${name===a.goal?shelter(x*8,y*4):''}<circle cx="${x*8}" cy="${y*4}" r="16" fill="${fill}" stroke="#1e293b" stroke-width="2"/><text x="${x*8}" y="${y*4+5}" text-anchor="middle" font-size="15" font-weight="bold">${esc(name)}</text>`}).join('');
const[tx,ty]=n[a.current],deadline=a.objective==='deadline',tr=Math.min(a.distance/Math.max(deadline?a.deadline:(a.distance+3),1),1),tc=deadline&&a.distance>a.deadline?'#dc2626':'#2563eb',fv=a.fuel_capacity==null?'—':`${a.fuel} / ${a.fuel_capacity}`,fr=a.fuel_capacity==null?1:Math.max(0,Math.min(a.fuel/a.fuel_capacity,1)),fc=fr>.3?'#15803d':'#dc2626',done=a.current===a.goal,fuelTop=a.fuel_capacity==null?'':`<g transform="translate(640,8)"><rect width="160" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="10" y="13" font-size="10" font-weight="bold" fill="#166534">FUEL</text><text x="10" y="28" font-size="15" font-weight="bold">${fv}</text><rect x="70" y="21" width="78" height="6" rx="3" fill="#bbf7d0"/><rect x="70" y="21" width="${78*fr}" height="6" rx="3" fill="${fc}"/></g>`;
const dense=e.length>15,svgWidth=dense?'1180':'100%',wrapStyle=dense?'height:620px;overflow:auto;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;':'';root.innerHTML=`<div id="mapwrap" style="${wrapStyle}"><svg viewBox="0 0 820 470" width="${svgWidth}">${roads}${nodes}${truck(tx*8,ty*4)}${fuelTop}<g transform="translate(18,385)"><rect width="420" height="24" rx="6" fill="#fff"/><circle cx="15" cy="12" r="5" fill="#f59e0b"/><text x="26" y="16" font-size="12">truck</text><circle cx="86" cy="12" r="5" fill="#16a34a"/><text x="97" y="16" font-size="12">passable</text><circle cx="175" cy="12" r="5" fill="#dc2626"/><text x="186" y="16" font-size="12">blocked</text><rect x="247" y="5" width="10" height="14" fill="#15803d"/><text x="266" y="16" font-size="12">fuel depot</text><text x="355" y="16" font-size="12" font-weight="bold" fill="#9a3412">Shelter B: ${done?'DELIVERED':'EN ROUTE'}</text></g><g transform="translate(18,418)"><rect width="370" height="43" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="18" y="14" font-size="10" font-weight="bold" fill="#1e3a8a">${deadline?'DELIVERY TIME / LIMIT':'DELIVERY TIME'}</text><text x="18" y="29" font-size="16" font-weight="bold">${deadline?a.distance+' / '+a.deadline:a.distance}</text><text x="83" y="29" font-size="10" fill="#475569">time units travelled</text><rect x="140" y="34" width="220" height="5" rx="3" fill="#cbd5e1"/><rect x="140" y="34" width="${220*tr}" height="5" rx="3" fill="${tc}"/></g><g transform="translate(432,418)"><rect width="370" height="43" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="14" font-size="10" font-weight="bold" fill="#166534">FUEL RESERVE</text><text x="18" y="29" font-size="16" font-weight="bold">${fv}</text><text x="76" y="29" font-size="10" fill="#475569">${a.fuel_capacity==null?'no fuel constraint':'refill at pump icons'}</text><rect x="140" y="34" width="220" height="5" rx="3" fill="#bbf7d0"/><rect x="140" y="34" width="${220*fr}" height="5" rx="3" fill="${fc}"/></g></svg></div>`;
root.querySelectorAll('.clickable').forEach(el=>{const go=()=>post('streamlit:setComponentValue',{value:el.dataset.e});el.onclick=go;el.onkeydown=q=>{if(q.key==='Enter'||q.key===' '){q.preventDefault();go()}}});requestAnimationFrame(()=>{const box=root.querySelector('#mapwrap');const contentHeight=(box?box.getBoundingClientRect().height:470)+hint.getBoundingClientRect().height+12;post('streamlit:setFrameHeight',{height:Math.ceil(contentHeight)})})}
window.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='streamlit:render')render(ev.data.args)});post('streamlit:componentReady',{apiVersion:1});
</script></body></html>
